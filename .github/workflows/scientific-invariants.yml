name: Scientific invariants
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_assurance test_followup
      - run: python audit_evidence.py
      - run: python build_compact.py --out /tmp/manuscript.docx
      - run: python audit_revision.py --manuscript /tmp/manuscript.docx
